
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open App</title>

    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            background: #f9f9f9;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        h2 {
            margin-bottom: 16px;
        }

        p {
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 28px;
            background: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
        }

        .instructions {
            margin-top: 40px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Opening Google Play Store...</h2>

    <p>
        If the Play Store does not open automatically,
        tap the button below.
    </p>

    <a
        id="playStoreBtn"
        class="btn"
        href="https://play.google.com/store/apps/details?id=com.semmozhi.app.semmozhi">
        Open in Play Store
    </a>

    <div class="instructions">
        <strong>Instagram users:</strong><br>
        If nothing happens, tap <strong>⋮</strong> and choose
        <strong>"Open in Browser"</strong>.
    </div>
</div>

<script>
    (function () {

        const packageName = "com.semmozhi.app.semmozhi";

        const playStoreUrl =
            "https://play.google.com/store/apps/details?id=" + packageName;

        const marketUrl =
            "market://details?id=" + packageName;

        const intentUrl =
            "intent://details?id=" + packageName +
            "#Intent;scheme=market;package=com.android.vending;end";

        const userAgent =
            navigator.userAgent ||
            navigator.vendor ||
            window.opera ||
            "";

        const isAndroid = /android/i.test(userAgent);
        const isInstagram = /instagram/i.test(userAgent);

        document.getElementById("playStoreBtn").href = playStoreUrl;

        function redirectToPlayStore() {

            if (!isAndroid) {
                window.location.replace(playStoreUrl);
                return;
            }

            if (isInstagram) {

                // Instagram WebView
                window.location.href = intentUrl;

                setTimeout(function () {
                    window.location.href = playStoreUrl;
                }, 1500);

                return;
            }

            // Chrome, Samsung Browser, etc.
            window.location.href = marketUrl;

            setTimeout(function () {
                window.location.href = playStoreUrl;
            }, 1500);
        }

        window.addEventListener("load", function () {
            setTimeout(redirectToPlayStore, 300);
        });

    })();
</script>

</body>
</html>
